services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fizlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fizlab_local}
      POSTGRES_DB: fizlab
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fizlab"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://fizlab:${POSTGRES_PASSWORD:-fizlab_local}@db:5432/fizlab?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  postgres_data:
